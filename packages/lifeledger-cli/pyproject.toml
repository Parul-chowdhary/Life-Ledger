[tool.poetry]
name = "lifeledger-cli"
version = "1.0.0"
description = "Command-Line Interface for LifeLedger Intelligence Platform"
authors = ["LifeLedger Team <architect@lifeledger.internal>"]
readme = "README.md"
packages = [{ include = "lifeledger_cli", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
requests = "^2.31.0"
rich = "^13.7.0"

[tool.poetry.scripts]
lifeledger = "lifeledger_cli.main:cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
